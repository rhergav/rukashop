<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RukaShop | Suscripciones PS Plus</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #00439C;
        --brand-hover: #003073;
        --brand-light: #e0e7ff;
        --border: #e2e8f0;
        --gradient-1: #dbeafe;
        --gradient-2: #e0e7ff;
        --kofi: #ff5e5b;
        --kofi-hover: #e04b49;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --text: #f8fafc;
          --muted: #94a3b8;
          --brand: #3b82f6;
          --brand-hover: #60a5fa;
          --brand-light: #1e3a8a;
          --border: #334155;
          --gradient-1: #1e1b4b;
          --gradient-2: #0f172a;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background-color: var(--bg);
        background-image: radial-gradient(circle at top right, var(--gradient-1) 0%, transparent 40%),
                          radial-gradient(circle at top left, var(--gradient-2) 0%, transparent 40%);
        background-attachment: fixed;
        transition: background-color 0.3s, color 0.3s;
      }
      .container {
        width: min(1200px, 92%);
        margin: 0 auto;
      }
      
      header {
        padding: 4rem 0 3rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--brand);
      }
      .subtitle {
        color: var(--muted);
        margin-top: 1rem;
        font-size: 1.1rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin: 2.5rem auto 1.5rem;
        max-width: 800px;
        background: var(--card);
        padding: 0.5rem;
        border-radius: 100px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
      }
      input, select {
        border: none;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        background: transparent;
        outline: none;
        font-family: inherit;
        color: var(--text);
      }
      input { flex: 1; min-width: 200px; }
      select {
        border-left: 1px solid var(--border);
        padding-left: 1.5rem;
        font-weight: 500;
        color: var(--brand);
        cursor: pointer;
      }
      
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        padding-bottom: 4rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border-color: var(--brand);
      }
      .category-pill {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0.4rem 0.8rem;
        border-radius: 50px;
        margin-bottom: 1rem;
        align-self: flex-start;
      }
      .name {
        font-weight: 800;
        font-size: 1.3rem;
        margin: 0 0 0.5rem 0;
      }
      .desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        line-height: 1.4;
      }

      /* --- NUEVO: Caja de instrucciones para Ko-fi --- */
      .kofi-note {
        background-color: rgba(255, 94, 91, 0.1);
        border: 1px solid rgba(255, 94, 91, 0.3);
        border-radius: 12px;
        padding: 0.8rem;
        margin-bottom: 1.5rem;
        font-size: 0.85rem;
        color: var(--text);
        line-height: 1.5;
      }
      .kofi-note strong {
        color: var(--kofi);
      }

      .bottom {
        margin-top: auto;
        padding-top: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px dashed var(--border);
      }
      .price {
        color: var(--text);
        font-weight: 800;
        font-size: 1.5rem;
      }
      .buy {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        background: var(--kofi);
        color: white;
        padding: 0.7rem 1.2rem;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .buy:hover { 
        background: var(--kofi-hover); 
      }
      .buy svg { width: 18px; height: 18px; }
      
      .empty {
        text-align: center;
        color: var(--muted);
        margin: 3rem 0;
        font-size: 1.1rem;
      }
      
      footer {
        text-align: center;
        border-top: 1px solid var(--border);
        padding: 2rem 0;
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 2rem;
      }
      
      @media (max-width: 600px) {
        .controls { flex-direction: column; border-radius: 16px; padding: 0; }
        select { border-left: none; border-top: 1px solid var(--border); padding: 1rem; }
        input { padding: 1rem; }
      }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>RukaShop</h1>
      <p class="subtitle">Suscripciones de PS Plus. Compra de forma segura, como particular y sin intermediarios.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Buscar suscripción..." />
        <select id="category">
          <option value="all">Todas las categorías</option>
        </select>
      </div>
    </header>

    <main class="container">
      <section class="products" id="products"></section>
      <p class="empty" id="empty" hidden>No hay suscripciones que coincidan con tu búsqueda.</p>
    </main>

    <footer class="container">
      &copy; 2026 RukaShop. Operado a través de donaciones seguras en Ko-fi. Esta web no está afiliada a Sony Interactive Entertainment.
    </footer>

    <script>
      // TU ENLACE DE KO-FI
      const KOFI_URL = "https://ko-fi.com/ricardohg";

      const products =[
        {
          name: "PS Plus Essential - 12 Meses",
          category: "Essential",
          desc: "Acceso al multijugador online, juegos mensuales y descuentos.",
          price: "50 €"
        },
        {
          name: "PS Plus Extra - 12 Meses",
          category: "Extra",
          desc: "Todo lo de Essential + catálogo de hasta 400 juegos de PS4 y PS5.",
          price: "80 €"
        },
        {
          name: "PS Plus Premium - 12 Meses",
          category: "Premium",
          desc: "Todo lo de Extra + catálogo de clásicos y streaming en la nube.",
          price: "100 €"
        },
        {
          name: "PS Plus Essential - 3 Meses",
          category: "Essential",
          desc: "Suscripción trimestral. Multijugador online y juegos mensuales.",
          price: "20 €"
        }
      ];

      const productsEl = document.getElementById("products");
      const emptyEl = document.getElementById("empty");
      const searchEl = document.getElementById("search");
      const categoryEl = document.getElementById("category");

      const categories =[...new Set(products.map((p) => p.category))];
      categories.forEach((cat) => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categoryEl.appendChild(option);
      });

      // Icono de un corazón para el botón de Ko-fi
      const heartIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /></svg>`;

      function renderProducts() {
        const query = searchEl.value.trim().toLowerCase();
        const selectedCategory = categoryEl.value;

        const filtered = products.filter((product) => {
          const matchesSearch = product.name.toLowerCase().includes(query);
          const matchesCategory = selectedCategory === "all" || product.category === selectedCategory;
          return matchesSearch && matchesCategory;
        });

        const fragment = document.createDocumentFragment();

        filtered.forEach((product) => {
          const card = document.createElement("article");
          card.className = "card";

          const category = document.createElement("span");
          category.className = "category-pill";
          category.textContent = product.category;

          const name = document.createElement("h3");
          name.className = "name";
          name.textContent = product.name;

          const desc = document.createElement("p");
          desc.className = "desc";
          desc.textContent = product.desc;

          // NUEVO: La caja de instrucciones de Ko-fi para este producto
          const kofiNote = document.createElement("div");
          kofiNote.className = "kofi-note";
          kofiNote.innerHTML = `💡 Al hacer clic, entrarás en Ko-fi. Introduce una donación de <strong>${product.price}</strong> y escribe <strong>"${product.name}" junto a tu Email/Telegram</strong> en el mensaje para enviarte el código.`;

          const bottom = document.createElement("div");
          bottom.className = "bottom";

          const price = document.createElement("span");
          price.className = "price";
          price.textContent = product.price;

          // Ahora es un enlace directo seguro (sin pop-ups)
          const buy = document.createElement("a");
          buy.className = "buy";
          buy.href = KOFI_URL;
          buy.target = "_blank"; // Se abre en una pestaña nueva para no perder tu tienda
          buy.rel = "noopener noreferrer";
          buy.innerHTML = `${heartIcon} Donar en Ko-fi`;

          bottom.appendChild(price);
          bottom.appendChild(buy);

          card.appendChild(category);
          card.appendChild(name);
          card.appendChild(desc);
          card.appendChild(kofiNote);
          card.appendChild(bottom);

          fragment.appendChild(card);
        });

        productsEl.replaceChildren(fragment);
        emptyEl.hidden = filtered.length > 0;
      }

      searchEl.addEventListener("input", renderProducts);
      categoryEl.addEventListener("change", renderProducts);
      renderProducts();
    </script>
  </body>
</html>
