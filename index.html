<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RukaShop | Tu Tienda Online</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #4f46e5;
        --brand-hover: #4338ca;
        --brand-light: #e0e7ff;
        --ok: #10b981;
        --border: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background-color: var(--bg);
        background-image: radial-gradient(circle at top right, #e0e7ff 0%, transparent 40%),
                          radial-gradient(circle at top left, #f3e8ff 0%, transparent 40%);
        background-attachment: fixed;
      }
      .container {
        width: min(1200px, 92%);
        margin: 0 auto;
      }
      
      /* --- HEADER & BÚSQUEDA --- */
      header {
        padding: 4rem 0 3rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, var(--brand), #9333ea);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .subtitle {
        color: var(--muted);
        margin-top: 1rem;
        font-size: 1.1rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin: 2.5rem auto 1.5rem;
        max-width: 800px;
        background: var(--card);
        padding: 0.5rem;
        border-radius: 100px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        border: 1px solid var(--border);
      }
      input, select {
        border: none;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        background: transparent;
        outline: none;
        font-family: inherit;
        color: var(--text);
      }
      input {
        flex: 1;
        min-width: 200px;
      }
      select {
        border-left: 1px solid var(--border);
        padding-left: 1.5rem;
        font-weight: 500;
        color: var(--brand);
        cursor: pointer;
      }
      
      /* --- PRODUCTOS --- */
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 2rem;
        padding-bottom: 4rem;
      }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        padding: 1.2rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        border-color: var(--brand-light);
      }
      .img-wrapper {
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 1rem;
        background: var(--bg);
      }
      .image {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
      }
      .card:hover .image {
        transform: scale(1.05);
      }
      .category-pill {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0.3rem 0.8rem;
        border-radius: 50px;
        margin-bottom: 0.5rem;
      }
      .name {
        font-weight: 700;
        font-size: 1.2rem;
        margin: 0 0 0.5rem 0;
      }
      .bottom {
        margin-top: auto;
        padding-top: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px dashed var(--border);
      }
      .price {
        color: var(--text);
        font-weight: 800;
        font-size: 1.3rem;
      }
      .buy {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        background: var(--brand);
        color: white;
        padding: 0.7rem 1.2rem;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .buy:hover { 
        background: var(--brand-hover); 
      }
      .buy svg {
        width: 18px;
        height: 18px;
      }
      
      .empty {
        text-align: center;
        color: var(--muted);
        margin: 3rem 0;
        font-size: 1.1rem;
      }
      
      /* --- FOOTER --- */
      footer {
        text-align: center;
        border-top: 1px solid var(--border);
        padding: 2rem 0;
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 2rem;
      }
      
      /* --- RESPONSIVE --- */
      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          border-radius: 16px;
          padding: 0;
        }
        select {
          border-left: none;
          border-top: 1px solid var(--border);
          padding: 1rem;
        }
        input {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>RukaShop</h1>
      <p class="subtitle">Descubre nuestros mejores productos. Compra segura, rápida y sin complicaciones.</p>
      <div class="controls" role="search">
        <input id="search" type="search" placeholder="Buscar producto..." aria-label="Buscar producto" />
        <select id="category" aria-label="Filtrar por categoría">
          <option value="all">Todas las categorías</option>
        </select>
      </div>
    </header>

    <main class="container">
      <h2 class="sr-only">Catálogo de productos</h2>
      <section class="products" id="products" aria-live="polite"></section>
      <p class="empty" id="empty" hidden>No hay productos que coincidan con tu búsqueda.</p>
    </main>

    <footer class="container">
      &copy; 2026 RukaShop. Pagos gestionados de forma 100% segura a través de PayPal.
    </footer>

    <script>
      // Generador de imágenes de ejemplo (puedes borrarlo cuando uses tus fotos reales)
      function placeholder(title, color) {
        return `data:image/svg+xml;utf8,${encodeURIComponent(
          `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'>
            <defs>
              <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                <stop offset='0%' stop-color='${color}' />
                <stop offset='100%' stop-color='#ffffff' />
              </linearGradient>
            </defs>
            <rect width='100%' height='100%' fill='url(#g)' />
            <text x='50%' y='52%' text-anchor='middle' font-family='Inter, Arial, sans-serif' font-weight='600' font-size='38' fill='#1e293b'>${title}</text>
          </svg>`
        )}`;
      }

      /* ========================================================
         CONFIGURACIÓN DE PAYPAL ME
         ======================================================== */
      const PAYPAL_USER = "rhergav"; // <-- Aquí está configurado tu usuario

      function createPayPalMeLink(amount) {
        // Genera el enlace: https://paypal.me/rhergav/precioEUR
        return `https://paypal.me/${PAYPAL_USER}/${amount}EUR`;
      }

      /* ========================================================
         LISTA DE PRODUCTOS
         ======================================================== */
      const products =[
        {
          name: "Mochila Urbana",
          category: "Accesorios",
          price: "39,99 €",
          image: placeholder("Mochila Urbana", "#c7d2fe"),
          paymentUrl: createPayPalMeLink("39.99") // <--- Pon el precio con PUNTO decimal aquí
        },
        {
          name: "Auriculares Pro",
          category: "Tecnología",
          price: "89,00 €",
          image: placeholder("Auriculares Pro", "#bbf7d0"),
          paymentUrl: createPayPalMeLink("89.00")
        },
        {
          name: "Lámpara Minimal",
          category: "Hogar",
          price: "29,50 €",
          image: placeholder("Lámpara Minimal", "#fef08a"),
          paymentUrl: createPayPalMeLink("29.50")
        },
        {
          name: "Botella Térmica",
          category: "Deporte",
          price: "19,90 €",
          image: placeholder("Botella Térmica", "#fecdd3"),
          paymentUrl: createPayPalMeLink("19.90")
        }
      ];

      const productsEl = document.getElementById("products");
      const emptyEl = document.getElementById("empty");
      const searchEl = document.getElementById("search");
      const categoryEl = document.getElementById("category");
      
      // ¡IMPORTANTE! Se ha añadido "paypal.me" para que el sistema permita tus enlaces
      const trustedPaymentDomains = new Set(["www.paypal.com", "paypal.me"]);

      // Cargar categorías en el select
      const categories = [...new Set(products.map((product) => product.category))];
      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        option.textContent = category;
        categoryEl.appendChild(option);
      });

      // Filtro de seguridad para evitar enlaces maliciosos
      function getSafePaymentUrl(url) {
        if (typeof url !== "string") return "#";
        const normalized = url.trim();
        try {
          const parsed = new URL(normalized);
          const trustedDomain = trustedPaymentDomains.has(parsed.hostname.toLowerCase());
          return parsed.protocol === "https:" && trustedDomain ? normalized : "#";
        } catch {
          return "#";
        }
      }

      // Icono SVG para el botón de comprar
      const cartIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" /></svg>`;

      // Renderizar productos
      function renderProducts() {
        const query = searchEl.value.trim().toLowerCase();
        const selectedCategory = categoryEl.value;

        const filtered = products.filter((product) => {
          const matchesSearch = product.name.toLowerCase().includes(query);
          const matchesCategory = selectedCategory === "all" || product.category === selectedCategory;
          return matchesSearch && matchesCategory;
        });

        const fragment = document.createDocumentFragment();

        filtered.forEach((product) => {
          const card = document.createElement("article");
          card.className = "card";

          const imgWrapper = document.createElement("div");
          imgWrapper.className = "img-wrapper";
          
          const image = document.createElement("img");
          image.className = "image";
          image.src = product.image;
          image.alt = product.name;
          image.loading = "lazy";
          
          imgWrapper.appendChild(image);

          const category = document.createElement("span");
          category.className = "category-pill";
          category.textContent = product.category;

          const name = document.createElement("h3");
          name.className = "name";
          name.textContent = product.name;

          const bottom = document.createElement("div");
          bottom.className = "bottom";

          const price = document.createElement("span");
          price.className = "price";
          price.textContent = product.price;

          const buy = document.createElement("a");
          buy.className = "buy";
          buy.href = getSafePaymentUrl(product.paymentUrl);
          buy.target = "_blank";
          buy.rel = "noopener noreferrer nofollow";
          buy.setAttribute("aria-label", `Comprar ${product.name} por ${product.price}`);
          buy.innerHTML = `${cartIcon} Comprar`;

          bottom.appendChild(price);
          bottom.appendChild(buy);

          card.appendChild(imgWrapper);
          card.appendChild(category);
          card.appendChild(name);
          card.appendChild(bottom);

          fragment.appendChild(card);
        });

        productsEl.replaceChildren(fragment);
        emptyEl.hidden = filtered.length > 0;
      }

      searchEl.addEventListener("input", renderProducts);
      categoryEl.addEventListener("change", renderProducts);
      renderProducts();
    </script>
  </body>
</html>
