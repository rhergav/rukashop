<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RukaShop | Suscripciones PS Plus</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

      /* VARIABLES MODO CLARO (Por defecto) */
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --brand: #00439C; /* Azul PlayStation */
        --brand-hover: #003073;
        --brand-light: #e0e7ff;
        --ok: #10b981;
        --border: #e2e8f0;
        --gradient-1: #dbeafe;
        --gradient-2: #e0e7ff;
      }

      /* VARIABLES MODO OSCURO (Automático según el dispositivo del usuario) */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card: #1e293b;
          --text: #f8fafc;
          --muted: #94a3b8;
          --brand: #3b82f6; /* Azul más claro para que resalte en oscuro */
          --brand-hover: #60a5fa;
          --brand-light: #1e3a8a;
          --border: #334155;
          --gradient-1: #1e1b4b;
          --gradient-2: #0f172a;
        }
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text);
        background-color: var(--bg);
        background-image: radial-gradient(circle at top right, var(--gradient-1) 0%, transparent 40%),
                          radial-gradient(circle at top left, var(--gradient-2) 0%, transparent 40%);
        background-attachment: fixed;
        transition: background-color 0.3s, color 0.3s;
      }
      .container {
        width: min(1200px, 92%);
        margin: 0 auto;
      }
      
      header {
        padding: 4rem 0 3rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        letter-spacing: -1px;
        color: var(--brand);
      }
      .subtitle {
        color: var(--muted);
        margin-top: 1rem;
        font-size: 1.1rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      
      /* --- CONTROLES Y BÚSQUEDA --- */
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        margin: 2.5rem auto 1.5rem;
        max-width: 800px;
        background: var(--card);
        padding: 0.5rem;
        border-radius: 100px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border);
        transition: background-color 0.3s, border-color 0.3s;
      }
      input, select {
        border: none;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        background: transparent;
        outline: none;
        font-family: inherit;
        color: var(--text);
      }
      input { flex: 1; min-width: 200px; }
      select {
        border-left: 1px solid var(--border);
        padding-left: 1.5rem;
        font-weight: 500;
        color: var(--brand);
        cursor: pointer;
      }
      
      /* --- PRODUCTOS --- */
      .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 2rem;
        padding-bottom: 4rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        border-color: var(--brand);
      }
      .category-pill {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0.4rem 0.8rem;
        border-radius: 50px;
        margin-bottom: 1rem;
        align-self: flex-start;
      }
      .name {
        font-weight: 800;
        font-size: 1.3rem;
        margin: 0 0 0.5rem 0;
      }
      .desc {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        line-height: 1.4;
      }
      .bottom {
        margin-top: auto;
        padding-top: 1.2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px dashed var(--border);
      }
      .price {
        color: var(--text);
        font-weight: 800;
        font-size: 1.5rem;
      }
      .buy {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        background: var(--brand);
        color: white;
        padding: 0.7rem 1.2rem;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: background 0.2s;
        cursor: pointer;
        border: none;
      }
      .buy:hover { 
        background: var(--brand-hover); 
      }
      .buy svg {
        width: 18px;
        height: 18px;
      }
      
      .empty {
        text-align: center;
        color: var(--muted);
        margin: 3rem 0;
        font-size: 1.1rem;
      }
      
      footer {
        text-align: center;
        border-top: 1px solid var(--border);
        padding: 2rem 0;
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 2rem;
      }
      
      @media (max-width: 600px) {
        .controls {
          flex-direction: column;
          border-radius: 16px;
          padding: 0;
        }
        select {
          border-left: none;
          border-top: 1px solid var(--border);
          padding: 1rem;
        }
        input { padding: 1rem; }
      }
    </style>
  </head>
  <body>
    <header class="container">
      <h1>RukaShop</h1>
      <p class="subtitle">Suscripciones de PS Plus al mejor precio. Compra tu código de forma rápida, segura y actívalo en tu cuenta al instante.</p>
      <div class="controls">
        <input id="search" type="search" placeholder="Buscar suscripción..." />
        <select id="category">
          <option value="all">Todas las categorías</option>
        </select>
      </div>
    </header>

    <main class="container">
      <section class="products" id="products"></section>
      <p class="empty" id="empty" hidden>No hay suscripciones que coincidan con tu búsqueda.</p>
    </main>

    <footer class="container">
      &copy; 2026 RukaShop. Pagos gestionados a través de PayPal. Esta web no está afiliada a Sony Interactive Entertainment.
    </footer>

    <script>
      const PAYPAL_USER = "rhergav"; 

      function createPayPalMeLink(amount) {
        return `https://paypal.me/${PAYPAL_USER}/${amount}EUR`;
      }

      // LISTA DE SUSCRIPCIONES (Modifica precios y descripciones según necesites)
      const products =[
        {
          name: "PS Plus Essential - 12 Meses",
          category: "Essential",
          desc: "Acceso al multijugador online, juegos mensuales descargables y descuentos exclusivos.",
          price: "50,00 €",
          paymentUrl: createPayPalMeLink("50.00")
        },
        {
          name: "PS Plus Extra - 12 Meses",
          category: "Extra",
          desc: "Todo lo de Essential + un enorme catálogo de hasta 400 juegos de PS4 y PS5.",
          price: "80,00 €",
          paymentUrl: createPayPalMeLink("80.00")
        },
        {
          name: "PS Plus Premium - 12 Meses",
          category: "Premium",
          desc: "Todo lo de Extra + catálogo de clásicos, pruebas de juegos y streaming en la nube.",
          price: "100,00 €",
          paymentUrl: createPayPalMeLink("100.00")
        },
        {
          name: "PS Plus Essential - 3 Meses",
          category: "Essential",
          desc: "Suscripción trimestral. Multijugador online y juegos mensuales.",
          price: "20,00 €",
          paymentUrl: createPayPalMeLink("20.00")
        }
      ];

      const productsEl = document.getElementById("products");
      const emptyEl = document.getElementById("empty");
      const searchEl = document.getElementById("search");
      const categoryEl = document.getElementById("category");

      const categories =[...new Set(products.map((p) => p.category))];
      categories.forEach((cat) => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categoryEl.appendChild(option);
      });

      const psIcon = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>`;

      function renderProducts() {
        const query = searchEl.value.trim().toLowerCase();
        const selectedCategory = categoryEl.value;

        const filtered = products.filter((product) => {
          const matchesSearch = product.name.toLowerCase().includes(query);
          const matchesCategory = selectedCategory === "all" || product.category === selectedCategory;
          return matchesSearch && matchesCategory;
        });

        const fragment = document.createDocumentFragment();

        filtered.forEach((product) => {
          const card = document.createElement("article");
          card.className = "card";

          const category = document.createElement("span");
          category.className = "category-pill";
          category.textContent = product.category;

          const name = document.createElement("h3");
          name.className = "name";
          name.textContent = product.name;

          const desc = document.createElement("p");
          desc.className = "desc";
          desc.textContent = product.desc;

          const bottom = document.createElement("div");
          bottom.className = "bottom";

          const price = document.createElement("span");
          price.className = "price";
          price.textContent = product.price;

          const buy = document.createElement("button");
          buy.className = "buy";
          buy.innerHTML = `${psIcon} Comprar`;
          
          // Lógica para copiar al portapapeles y avisar antes de ir a PayPal
          buy.onclick = () => {
            navigator.clipboard.writeText(product.name).then(() => {
              alert(`¡IMPORTANTE!\n\nHemos copiado "${product.name}" a tu portapapeles.\n\nPor favor, cuando se abra PayPal, pégalo en el campo "Añadir una nota" o "Concepto" para que sepamos a quién enviar la suscripción.`);
              window.open(product.paymentUrl, '_blank');
            }).catch(() => {
              alert(`¡IMPORTANTE!\n\nPor favor, escribe "${product.name}" en el campo de "Añadir una nota" o "Concepto" de PayPal para que sepamos qué estás comprando.`);
              window.open(product.paymentUrl, '_blank');
            });
          };

          bottom.appendChild(price);
          bottom.appendChild(buy);

          card.appendChild(category);
          card.appendChild(name);
          card.appendChild(desc);
          card.appendChild(bottom);

          fragment.appendChild(card);
        });

        productsEl.replaceChildren(fragment);
        emptyEl.hidden = filtered.length > 0;
      }

      searchEl.addEventListener("input", renderProducts);
      categoryEl.addEventListener("change", renderProducts);
      renderProducts();
    </script>
  </body>
</html>
